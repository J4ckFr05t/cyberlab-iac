---
- name: Verify Paperclip service reports healthy
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai service status"
  args:
    chdir: "{{ paperclip_home }}"
  register: paperclip_status
  changed_when: false
  failed_when: paperclip_status.rc != 0

- name: Verify Paperclip API port is listening
  wait_for:
    port: "{{ paperclip_port }}"
    host: 127.0.0.1
    timeout: 60

- name: Verify Paperclip directories exist
  stat:
    path: "{{ paperclip_home }}/.paperclip"
  register: paperclip_dir
  failed_when: not paperclip_dir.stat.exists

- name: Verify Paperclip data directory ownership
  stat:
    path: "{{ paperclip_home }}"
  register: paperclip_home_stat
  failed_when: paperclip_home_stat.stat.pw_name != paperclip_user

- name: Paperclip health check
  uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/health"
    method: GET
    status_code: [200, 404]
  register: paperclip_health
  failed_when: paperclip_health.status not in [200, 404]
