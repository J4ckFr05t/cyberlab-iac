---
- name: Check if Paperclip is already installed
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai --version"
  args:
    chdir: "{{ paperclip_home }}"
  register: paperclip_version
  changed_when: false
  failed_when: false

- name: Run Paperclip managed installer
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin npx --yes paperclipai install"
  args:
    chdir: "{{ paperclip_home }}"
  when: paperclip_version.rc != 0

- name: Check for existing Paperclip config
  stat:
    path: "{{ paperclip_home }}/.paperclip/instances/default/config.json"
  register: paperclip_config

- name: Initialize database and default config
  # NOTE: `paperclipai onboard` starts the server in the FOREGROUND.
  # We run it with a timeout; once config + doctor have completed the
  # server it spawns is killed by the timeout, which is fine -- the
  # service start below brings Paperclip back up properly.
  # rc 124 = killed by timeout (expected on first run).
  shell: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin timeout 45 paperclipai onboard --yes; rc=$?; [ $rc -eq 124 ] && exit 0 || exit $rc"
  args:
    chdir: "{{ paperclip_home }}"
    executable: /bin/bash
  register: paperclip_onboard
  failed_when: paperclip_onboard.rc not in [0, 124]
  changed_when: paperclip_onboard.rc == 0
  when: not paperclip_config.stat.exists
  ignore_errors: yes

- name: Check Paperclip service status
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai service status"
  args:
    chdir: "{{ paperclip_home }}"
  register: paperclip_service_status
  changed_when: false
  failed_when: false

- name: Register Paperclip as an always-on background service
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai service install"
  args:
    chdir: "{{ paperclip_home }}"
  when: paperclip_service_status.rc != 0
  ignore_errors: yes  # falls back gracefully when no systemd user manager exists

- name: Ensure Paperclip service is started
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai service start"
  args:
    chdir: "{{ paperclip_home }}"
  register: paperclip_service_start
  changed_when: "'started' in paperclip_service_start.stdout"
  failed_when: false

- name: Check whether Paperclip is already listening on port {{ paperclip_port }}
  shell: "timeout 2 bash -c '</dev/tcp/127.0.0.1/{{ paperclip_port }}'"
  args:
    executable: /bin/bash
  register: paperclip_port_open
  changed_when: false
  failed_when: false

- name: Start Paperclip server in background (fallback when no systemd user manager)
  shell: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin nohup paperclipai run >> {{ paperclip_home }}/.paperclip/instances/default/logs/ansible-run.log 2>&1 &"
  args:
    chdir: "{{ paperclip_home }}"
    executable: /bin/bash
  when: paperclip_port_open.rc != 0
  ignore_errors: yes

- name: Check whether Paperclip config needs restoring to loopback
  shell: "grep -c -E '\"bind\": \"0.0.0.0\"|\"deploymentMode\": \"private\"' {{ paperclip_home }}/.paperclip/instances/default/config.json || true"
  register: paperclip_config_external
  changed_when: false
  failed_when: false

- name: Restore Paperclip config to loopback local_trusted mode
  shell: "sed -i 's/\"bind\": \"0.0.0.0\"/\"bind\": \"loopback\"/; s/\"deploymentMode\": \"private\"/\"deploymentMode\": \"local_trusted\"/' {{ paperclip_home }}/.paperclip/instances/default/config.json"
  args:
    executable: /bin/bash
  when: paperclip_config_external.stdout | int > 0
  changed_when: true

- name: Restart Paperclip server to apply config restore
  shell: |
    pkill -f '[d]ist/index.js run' || true
    sleep 3
    sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin nohup paperclipai run >> {{ paperclip_home }}/.paperclip/instances/default/logs/ansible-run.log 2>&1 &
  args:
    chdir: "{{ paperclip_home }}"
    executable: /bin/bash
  when: paperclip_config_external.stdout | int > 0
  changed_when: true

- name: Check if hostname already allowed in Paperclip config
  shell: "grep -c '{{ ansible_host }}' {{ paperclip_home }}/.paperclip/instances/default/config.json || true"
  register: paperclip_allowed_host
  changed_when: false
  failed_when: false

- name: Allow the lab hostname in Paperclip
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin paperclipai allowed-hostname {{ ansible_host }}"
  args:
    chdir: "{{ paperclip_home }}"
  when: paperclip_allowed_host.stdout | int == 0
  register: paperclip_allowed_host_result
  changed_when: paperclip_allowed_host_result.rc == 0

- name: Restart Paperclip server to apply allowed hostname
  shell: |
    pkill -f '[d]ist/index.js run' || true
    sleep 3
    sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin nohup paperclipai run >> {{ paperclip_home }}/.paperclip/instances/default/logs/ansible-run.log 2>&1 &
  args:
    chdir: "{{ paperclip_home }}"
    executable: /bin/bash
  when: paperclip_allowed_host.stdout | int == 0
  changed_when: true

- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes

- name: Configure nginx to reverse-proxy Paperclip on the LAN interface
  template:
    src: paperclip_nginx.conf.j2
    dest: /etc/nginx/sites-available/paperclip
    mode: '0644'
  become: yes
  notify: Reload nginx

- name: Enable paperclip nginx site
  file:
    src: /etc/nginx/sites-available/paperclip
    dest: /etc/nginx/sites-enabled/paperclip
    state: link
  become: yes
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: yes
  notify: Reload nginx

- name: Wait for Paperclip API to listen on port {{ paperclip_port }}
  wait_for:
    port: "{{ paperclip_port }}"
    host: 127.0.0.1
    timeout: 120
