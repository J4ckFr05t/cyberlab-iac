---
- name: Set npm prefix to user-writable directory
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin npm config set prefix /home/paperclip/.local"
  args:
    chdir: "{{ paperclip_home }}"
  changed_when: false

- name: Install opencode CLI
  command: "sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin npm install -g opencode-ai"
  args:
    chdir: "{{ paperclip_home }}"
  register: opencode_install
  changed_when: "'added' in opencode_install.stdout or 'changed' in opencode_install.stdout"

- name: Check opencode authentication
  command: "sudo -u {{ paperclip_user }} env -i HOME={{ paperclip_home }} PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin opencode auth list"
  args:
    chdir: "{{ paperclip_home }}"
  register: opencode_auth
  changed_when: false
  failed_when: false

- name: Report opencode auth status
  debug:
    msg: >-
      {% if opencode_auth.rc != 0 or 'opencode' not in opencode_auth.stdout %}
      opencode is NOT authenticated. Create a key at https://opencode.ai/auth, then run:
        sudo -u {{ paperclip_user }} env -i HOME={{ paperclip_home }} PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin sh -c 'cd {{ paperclip_home }} && opencode auth login --provider opencode'
      {% else %}
      opencode is authenticated.
      {% endif %}

- name: Configure agents with opencode adapter
  # opencode_local requires model in provider/model format; cwd must be absolute.
  command: >
    sudo -u {{ paperclip_user }} -H env PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    paperclipai agent update {{ paperclip_agent_ids[item.name] }}
    --payload-json '{"adapterType": "opencode_local",
      "adapterConfig": {"cwd": "{{ paperclip_home }}", "model": "{{ paperclip_opencode_model }}"}}'
  args:
    chdir: "{{ paperclip_home }}"
  loop: "{{ paperclip_agents }}"
  loop_control:
    label: "{{ item.name }}"
  register: opencode_agent_update
  changed_when: opencode_agent_update.rc == 0
